# 發佈自動化：推送 v* 標籤時，於 Windows 環境打包 exe 並建立 GitHub Release。
#
# 流程：
#   1. 以 PyInstaller 依既有 spec 打包 SRT-Subtitle-Generator.exe
#   2. 從 CHANGELOG.md 抽出該版本的更新內容作為 Release notes
#   3. 建立 pre-release 並附上 exe
#
# 發佈為 pre-release 的原因：程式內建的自動更新走 /releases/latest
# （不含 pre-release）。維護者在 Windows 上驗證 exe 無誤後，把 Release
# 轉為正式版，既有使用者即會收到自動更新。
name: Release

on:
  push:
    tags:
      - "v*"
    # 版本升級合併進 main 時自動發版（updater.py 的 APP_VERSION 為準）。
    branches:
      - main
    paths:
      - "updater.py"
      - "CHANGELOG.md"
  # 手動觸發：不需先推標籤，Release 建立時會一併建立標籤。
  workflow_dispatch:
    inputs:
      tag:
        description: "要發佈的版本標籤（如 v1.4.0）；留空則取 updater.py 的 APP_VERSION"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve release tag
        shell: python
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          import os
          import pathlib
          import re

          tag = (os.environ.get("INPUT_TAG") or "").strip()
          if not tag and os.environ.get("GITHUB_REF_TYPE") == "tag":
              tag = os.environ["GITHUB_REF_NAME"]
          if not tag:
              # 手動觸發未指定標籤時，取 updater.py 內的 APP_VERSION。
              source = pathlib.Path("updater.py").read_text(encoding="utf-8")
              match = re.search(r'APP_VERSION\s*=\s*"([^"]+)"', source)
              tag = f"v{match.group(1)}"
          # 該版本的 Release 已存在時跳過建置（防止重複發版）。
          import urllib.request
          import urllib.error
          exists = "false"
          url = (f"https://api.github.com/repos/"
                 f"{os.environ['GITHUB_REPOSITORY']}/releases/tags/{tag}")
          try:
              with urllib.request.urlopen(url, timeout=15):
                  exists = "true"
          except urllib.error.HTTPError as err:
              if err.code != 404:
                  raise
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fp:
              fp.write(f"RELEASE_TAG={tag}\n")
              fp.write(f"RELEASE_EXISTS={exists}\n")

      - name: Install build dependencies
        if: env.RELEASE_EXISTS != 'true'
        run: pip install pyinstaller openai zhconv sv-ttk

      - name: Build exe with PyInstaller
        if: env.RELEASE_EXISTS != 'true'
        run: pyinstaller SRT-Subtitle-Generator.spec --noconfirm

      - name: Extract release notes from CHANGELOG
        if: env.RELEASE_EXISTS != 'true'
        shell: python
        run: |
          import os
          import pathlib
          import re

          tag = os.environ["RELEASE_TAG"]
          version = tag.lstrip("vV")
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          # 抓出對應版本的段落（從 "## vX.Y.Z" 到下一個 "## " 標題）。
          pattern = rf"^## v{re.escape(version)}.*?$(.*?)(?=^## |\Z)"
          match = re.search(pattern, text, re.M | re.S)
          notes = match.group(1).strip() if match else f"v{version}"
          notes += (
              "\n\n---\n"
              "本 Release 由自動化流程建置（exe 於 GitHub Actions "
              "windows-latest 打包）。維護者驗證 exe 無誤後，將本 Release "
              "由 pre-release 轉為正式版，既有使用者即會收到自動更新。"
          )
          pathlib.Path("RELEASE_NOTES.md").write_text(notes, encoding="utf-8")

      - name: Create GitHub pre-release with exe
        if: env.RELEASE_EXISTS != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$env:RELEASE_TAG"
          "dist/SRT-Subtitle-Generator.exe"
          --prerelease
          --title "$env:RELEASE_TAG"
          --notes-file RELEASE_NOTES.md
          --target "$env:GITHUB_SHA"
