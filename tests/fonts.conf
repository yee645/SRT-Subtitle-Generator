<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  測試用的字型設定（3.0 之後 A-5）：tests/run_all.py 透過 FONTCONFIG_FILE 交給每一個測試；
  幾個量像素或版面的測試單獨跑時也會自己套上（test_v220、test_screentranslate_gui、test_qt_player）。

  為什麼要有：開發容器的映像在 2026-11-20 多了 /etc/fonts/conf.d/56-prefer-inter.conf，把 sans-serif、
  Segoe UI 等都導向 Inter；程式要的「Microsoft JhengHei」在 Linux 上沒有，於是退到 Inter，字高變了，
  三個版面／像素測試跟著失敗（例如即時查譯面板要 729px、預設只給 720px）。拿 2026-11-22 的舊版本在
  同一個環境跑也是同樣的失敗，所以是環境換了、不是程式壞了。

  做法：整套系統設定照用（字型資料夾、反鋸齒、各語言的偏好都不動），只把 Inter 拿掉，sans-serif
  回到 Ubuntu 本來的 DejaVu Sans、中文退到文泉驛正黑——這些測試當初就是在這個組合下量的。
  斷言一條都沒有放寬。在 Windows／macOS 上 Qt 與 Tk 不走 fontconfig，這個檔不會有任何作用。
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <selectfont>
    <rejectfont>
      <pattern><patelt name="family"><string>Inter</string></patelt></pattern>
      <pattern><patelt name="family"><string>Inter Display</string></patelt></pattern>
    </rejectfont>
  </selectfont>
</fontconfig>
